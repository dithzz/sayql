<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you · SayQL</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg: #f7f8fa; --surface: #fff; --text: #1d2125; --muted: #56606b; --border: #d6dae0; --accent: #1f6feb; --warn: #9a6700; }
  @media (prefers-color-scheme: dark) { :root { --bg: #131518; --surface: #1f2227; --text: #e2e5e9; --muted: #a3aab4; --border: #33373e; --accent: #6aa2ff; --warn: #e3b341; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  main { width: 100%; max-width: 520px; padding: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 12px; color: var(--muted); }
  p strong { color: var(--text); }
  a { color: var(--accent); }
  .warn { color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1 id="title">Thank you</h1>
  <p id="what">Your key is on its way by email, usually within a minute, from <strong>keys@sayql.dev</strong>. Check your spam folder if it isn't there.</p>
  <p id="failed" class="warn" hidden>The payment didn't go through, so nothing was charged. <a href="/#pricing">Try again</a>, or email us for an invoice.</p>
  <p>Questions? <a href="mailto:hello@azenvoc.com">hello@azenvoc.com</a> · <a href="/">sayql.dev</a></p>
</main>
<script>
  // Dodo adds ?status=succeeded|failed|... ; the product is ours, from /api/checkout.
  var q = new URLSearchParams(location.search);
  var product = q.get("product") || "";
  if (q.get("status") && q.get("status") !== "succeeded" && q.get("status") !== "active") {
    document.getElementById("title").textContent = "Payment not completed";
    document.getElementById("what").hidden = true;
    document.getElementById("failed").hidden = false;
  } else if (product === "team") {
    document.getElementById("what").innerHTML = "Your SayQL for teams licence key is on its way by email from <strong>keys@sayql.dev</strong>. Paste it on your server's admin page: Overview → Licence key. Check your spam folder if it isn't there.";
  } else if (product.indexOf("credits-") === 0) {
    document.getElementById("what").innerHTML = "Your SayQL AI credit key (or, if you've bought before with this email, the top-up) is on its way by email from <strong>keys@sayql.dev</strong>, usually within a minute. Check your spam folder if it isn't there.";
  }
</script>
</body>
</html>

<!doctype html>
<!-- One 1920×1080 video frame: render.mjs sets its state with window.frame(...) and screenshots it. -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0b0f17;
    --glow-a: rgba(31, 111, 235, 0.22);
    --glow-b: rgba(112, 72, 232, 0.18);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --blue: #4a8dff;
    --violet: #a98bff;
    --violet-bg: rgba(112, 72, 232, 0.16);
    --violet-border: rgba(112, 72, 232, 0.45);
    --caption-bg: rgba(15, 20, 30, 0.82);
    --caption-border: rgba(255, 255, 255, 0.08);
    --window-border: rgba(255, 255, 255, 0.09);
    --shadow: 0 40px 120px rgba(0, 0, 0, 0.55), 0 8px 30px rgba(0, 0, 0, 0.35);
  }
  :root.light {
    --bg: #eef2f8;
    --glow-a: rgba(31, 111, 235, 0.16);
    --glow-b: rgba(112, 72, 232, 0.12);
    --text: #0f172a;
    --muted: #475569;
    --blue: #1f6feb;
    --violet: #7048e8;
    --violet-bg: rgba(112, 72, 232, 0.09);
    --violet-border: rgba(112, 72, 232, 0.35);
    --caption-bg: rgba(255, 255, 255, 0.9);
    --caption-border: rgba(15, 23, 42, 0.08);
    --window-border: rgba(15, 23, 42, 0.12);
    --shadow: 0 40px 110px rgba(15, 23, 42, 0.22), 0 8px 26px rgba(15, 23, 42, 0.12);
  }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: Inter, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(1100px 700px at 18% 10%, var(--glow-a), transparent 70%),
      radial-gradient(1000px 700px at 85% 95%, var(--glow-b), transparent 70%),
      var(--bg);
  }
  .layer { position: absolute; inset: 0; }
  .stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; will-change: transform; }
  .window {
    position: absolute; overflow: hidden; border-radius: 14px;
    box-shadow: var(--shadow); outline: 1px solid var(--window-border);
  }
  .window img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cursor { position: absolute; width: 22px; height: 33px; margin: -2px 0 0 -3px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .ripple { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; border: 2.5px solid var(--blue); }
  .caption {
    position: absolute; left: 50%; bottom: 54px; transform: translateX(-50%);
    padding: 18px 34px; border-radius: 999px; white-space: nowrap;
    background: var(--caption-bg); border: 1px solid var(--caption-border);
    color: var(--text); font-size: 40px; font-weight: 600; letter-spacing: -0.01em;
    box-shadow: 0 12px 40px rgba(0,0,0,.28); backdrop-filter: blur(12px);
  }
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px; }
  .card img { height: 170px; }
  .card .tagline { color: var(--text); font-size: 54px; font-weight: 600; letter-spacing: -0.02em; }
  .card .big { color: var(--text); font-size: 76px; font-weight: 700; letter-spacing: -0.03em; }
  .card .url { color: var(--blue); font-size: 44px; font-weight: 600; }
  .card .sub { color: var(--muted); font-size: 28px; font-weight: 500; margin-top: -24px; }
  .card .hook { color: var(--text); font-size: 80px; font-weight: 700; letter-spacing: -0.03em; text-align: center; line-height: 1.15; }
  .card .hook.accent { color: var(--blue); }
  .card .chips { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 1500px; }
  .card .chip {
    padding: 16px 30px; border-radius: 16px; font-size: 36px; font-weight: 600;
    color: var(--text); background: var(--caption-bg); border: 1px solid var(--window-border);
  }
  .card .tagline.headline { font-size: 64px; font-weight: 700; letter-spacing: -0.025em; text-align: center; }
  .card .tagline.headline em { font-style: normal; color: var(--blue); }
  .card .lead { color: var(--muted); font-size: 32px; font-weight: 500; text-align: center; max-width: 1300px; margin-top: -10px; }
  /* A caption inside a card (the terminal scenes), the same pill as the clips' caption. */
  .card .cap { position: absolute; left: 0; right: 0; bottom: 54px; display: flex; justify-content: center; }
  .card .cap span {
    padding: 18px 34px; border-radius: 999px; white-space: nowrap;
    background: var(--caption-bg); border: 1px solid var(--caption-border);
    color: var(--text); font-size: 40px; font-weight: 600; letter-spacing: -0.01em;
    box-shadow: 0 12px 40px rgba(0,0,0,.28);
  }
  /* A terminal running Claude Code: dark in both themes, like most terminals. */
  .card.terminal { justify-content: flex-start; padding-top: 46px; }
  .term {
    width: 1600px; height: 830px; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
    background: #0d1117; box-shadow: var(--shadow); outline: 1px solid var(--window-border);
  }
  .term-bar { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 20px; background: #161b22; border-bottom: 1px solid #262c36; }
  .term-bar i { width: 14px; height: 14px; border-radius: 50%; background: #3a404a; }
  .term-bar span { flex: 1; text-align: center; color: #8b949e; font-size: 20px; font-weight: 500; margin-right: 62px; }
  .term-body {
    flex: 1; overflow: hidden; padding: 26px 34px; color: #d6dde6;
    font: 500 25px/1.5 "SF Mono", Menlo, Monaco, monospace; white-space: pre-wrap; word-break: break-word;
  }
  .term-body .l { min-height: 1.5em; margin-bottom: 0.6em; }
  .term-body .you { color: #f0f3f6; }
  .term-body .you b { color: #8b949e; font-weight: 500; }
  .term-body .tool b { color: #3fb950; font-weight: 500; }
  .term-body .tool { color: #f0f3f6; }
  .term-body .tool .args { color: #8b949e; }
  .term-body .out { color: #8b949e; padding-left: 1.4em; }
  .term-body .out .k { color: #79c0ff; }
  .term-body .err { color: #ff7b72; padding-left: 1.4em; }
  .term-body .say { color: #f0f3f6; }
  .term-body .say b { color: #f0f3f6; font-weight: 500; }
  .term-body .hl { background: rgba(63, 185, 80, 0.16); color: #7ee787; border-radius: 4px; }
  .term-body .caret { display: inline-block; width: 0.6em; height: 1.1em; vertical-align: -0.18em; background: #d6dde6; margin-left: 2px; }
  .card .pill {
    padding: 10px 24px; border-radius: 999px; font-size: 28px; font-weight: 600; letter-spacing: 0.02em;
    color: var(--violet); background: var(--violet-bg); border: 1px solid var(--violet-border);
  }
</style>
</head>
<body>
<div class="bg"></div>
<div id="layers"></div>
<div id="cards"></div>
<div id="caption" class="caption" style="opacity:0"></div>
<script>
  const CURSOR = `<svg class="cursor" viewBox="0 0 22 33"><path d="M2 2v25l6.5-6.2 4.3 9.7 4-1.8-4.2-9.5H21z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
  // The terminal scenes: Claude Code asking SayQL over MCP, as the desktop app answers it (src-tauri/src/mcp.rs):
  // counts and summaries by default, and a never-send column refused. Each line shows at `at` seconds into its
  // card; `type` types it at that many characters a second.
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const ASK_COUNT = [
    { at: 0, cls: "you", pre: "<b>&gt; </b>", text: "How many orders were refunded in October?", type: 21, from: 0.5 },
    { at: 2.9, cls: "tool", html: `<b>⏺</b> sayql - run_query (MCP)<span class="args">(connection_id: "demo", sql: "SELECT COUNT(*) AS refunded, COUNT(DISTINCT customer_id) AS customers FROM orders WHERE status = 'refunded' AND ordered_at &gt;= '2026-10-01'")</span>` },
    { at: 3.9, cls: "out", html:
        `⎿  {"summary": {"rowCount": 1, "truncated": false, "columns": [\n` +
        `     {"name": "refunded", "type": "number", "nulls": 0, "distinct": 1, "min": 39, "max": 39},\n` +
        `     {"name": "customers", "type": "number", "nulls": 0, "distinct": 1, "min": 37, "max": 37}]},\n` +
        `    "note": "The user lets AI apps see counts and column summaries on this connection, <span class="hl">not row values</span>. …"}` },
    { at: 6.3, cls: "say", pre: "<b>⏺</b> ", text: "39 orders were refunded in October, from 37 customers.", type: 42 },
  ];
  const ASK_EMAILS = [
    { at: 0.2, cls: "you", pre: "<b>&gt; </b>", text: "Now list their emails, so I can send them a coupon.", type: 21, from: 0.6 },
    { at: 3.4, cls: "tool", html: `<b>⏺</b> sayql - run_query (MCP)<span class="args">(connection_id: "demo", sql: "SELECT c.email FROM customers c JOIN orders o ON o.customer_id = c.id WHERE o.status = 'refunded'")</span>` },
    { at: 4.2, cls: "err", html: "⎿  Error: email is a column the user marked never to send to AI apps. Leave it out of the query." },
    { at: 5.3, cls: "say", pre: "<b>⏺</b> ", text: "Emails are marked private in SayQL, so I can't see them. I can open the query in SayQL for you to run there.", type: 48 },
  ];
  const line = (l, shift = 0) => {
    const at = l.at + shift;
    const body = l.text !== undefined ? `${l.pre}<span data-type="${l.type}" data-from="${(l.from ?? l.at) + shift}" data-full="${esc(l.text)}"></span>` : l.html;
    return `<div class="l ${l.cls}" data-show="${at}">${body}</div>`;
  };
  const terminal = (lines, cap) =>
    `<div class="term"><div class="term-bar"><i></i><i></i><i></i><span>~/shop — claude</span></div><div class="term-body">${lines}</div></div>` +
    (cap ? `<div class="cap" data-at="${cap.at}"><span>${cap.text}</span></div>` : "");
  const CARDS = {
    hook: () => `<div class="hook">Your AI agents want your database.</div><div class="hook accent" data-at="1.6">Your data shouldn't go with them.</div>`,
    title: () =>
      `<img src="${WORDMARK}"><div class="tagline headline">Let agents into your database. <em>Not your data.</em></div>` +
      `<div class="lead" data-at="0.6">The governance layer between AI agents and your databases</div>`,
    // Claude Code asks; SayQL answers with counts and summaries, not rows.
    agentCounts: () => terminal(ASK_COUNT.map((l) => line(l)).join(""), { at: 4.4, text: "It gets the numbers it needs, not your rows" }),
    // The same terminal, on: a private column is refused. Its first lines are already there.
    agentRefused: () =>
      terminal(ASK_COUNT.map((l) => line(l, -100)).join("") + `<div class="l"></div>` + ASK_EMAILS.map((l) => line(l)).join(""), { at: 4.4, text: "Private columns are refused" }),
    end: () =>
      `<div class="big">Free and open source</div><img src="${WORDMARK}"><div class="tagline" data-at="0.4">Teams free for 30 days</div>` +
      `<div class="url" data-at="0.7">${SITE}</div>${SITE_NOW ? `<div class="sub">${SITE_NOW}</div>` : ""}`,
    // The 15-second cut's last card: the headline and the site.
    endShort: () =>
      `<img src="${WORDMARK}"><div class="tagline headline">Let agents into your database. <em>Not your data.</em></div>` +
      `<div class="url" data-at="0.4">${SITE}</div>`,
  };
  for (const k of ["agentCounts", "agentRefused"]) CARDS[k].terminal = true;
  const layers = [];
  function layer(i) {
    if (!layers[i]) {
      const el = document.createElement("div");
      el.className = "layer";
      el.innerHTML = `<div class="stage"><div class="window"><img></div>${CURSOR}<div class="ripple"></div></div>`;
      document.getElementById("layers").appendChild(el);
      layers[i] = { el, stage: el.querySelector(".stage"), win: el.querySelector(".window"), img: el.querySelector("img"),
                    cursor: el.querySelector(".cursor"), ripple: el.querySelector(".ripple"), src: "" };
    }
    return layers[i];
  }

  window.setup = ({ theme, win, wordmark, site, siteNow }) => {
    document.documentElement.classList.toggle("light", theme === "light");
    window.WIN = win;
    window.WORDMARK = wordmark;
    window.SITE = site;
    window.SITE_NOW = siteNow;
    return document.fonts.load("600 40px Inter").then(() => document.fonts.check("600 40px Inter"), () => false);
  };

  // state: { layers: [{ src, opacity, cam: {z, cx, cy}, cursor: {x, y, visible}, ripple: {x, y, p} | null }],
  //          cards: [{ kind, opacity, rise, local }], caption: { text, opacity } | null }
  window.frame = async (s) => {
    const loads = [];
    s.layers.forEach((l, i) => {
      const L = layer(i);
      L.el.style.display = "";
      L.el.style.opacity = l.opacity;
      Object.assign(L.win.style, { left: WIN.x + "px", top: WIN.y + "px", width: WIN.w + "px", height: WIN.h + "px" });
      L.stage.style.transform = `translate(${960 - l.cam.cx * l.cam.z}px, ${540 - l.cam.cy * l.cam.z}px) scale(${l.cam.z})`;
      if (L.src !== l.src) {
        L.src = l.src;
        L.img.src = l.src;
        loads.push(L.img.decode().catch(() => {}));
      }
      const c = l.cursor;
      L.cursor.style.display = c && c.visible ? "" : "none";
      if (c) Object.assign(L.cursor.style, { left: c.x + "px", top: c.y + "px", transform: `scale(${1 / Math.sqrt(l.cam.z)})`, transformOrigin: "3px 2px" });
      const r = l.ripple;
      L.ripple.style.display = r ? "" : "none";
      if (r) Object.assign(L.ripple.style, { left: r.x + "px", top: r.y + "px", opacity: 1 - r.p, transform: `scale(${0.4 + r.p * 0.9})` });
    });
    layers.slice(s.layers.length).forEach((L) => (L.el.style.display = "none"));

    // Cards: up to two at once while one fades into the next. Parts with data-at come in that
    // many seconds into the card.
    const box = document.getElementById("cards");
    while (box.children.length < s.cards.length) {
      const el = document.createElement("div");
      el.className = "card";
      box.appendChild(el);
    }
    [...box.children].forEach((card, i) => {
      const c = s.cards[i];
      card.style.display = c ? "" : "none";
      if (!c) return;
      if (card.dataset.kind !== c.kind) {
        card.dataset.kind = c.kind;
        card.innerHTML = CARDS[c.kind]();
        card.classList.toggle("terminal", !!CARDS[c.kind].terminal);
        loads.push(...[...card.querySelectorAll("img")].map((im) => im.decode().catch(() => {})));
      }
      card.style.opacity = c.opacity;
      card.style.transform = `translateY(${c.rise}px)`;
      card.querySelectorAll("[data-at]").forEach((part) => {
        const k = Math.max(0, Math.min(1, (c.local - Number(part.dataset.at)) / 0.45));
        const e = 1 - (1 - k) ** 3;
        part.style.opacity = e;
        part.style.transform = `translateY(${(1 - e) * 18}px)`;
      });
      // Terminal lines: each shows at its time, typed ones a character at a time, with the caret on
      // the line being typed; the newest line stays in view, as in a terminal.
      let typing = null;
      card.querySelectorAll("[data-show]").forEach((l) => (l.style.display = c.local >= Number(l.dataset.show) ? "" : "none"));
      card.querySelectorAll("[data-type]").forEach((t) => {
        const full = t.dataset.full;
        const n = Math.max(0, Math.min(full.length, Math.floor((c.local - Number(t.dataset.from)) * Number(t.dataset.type))));
        t.textContent = full.slice(0, n);
        if (t.closest(".l").style.display !== "none" && n < full.length && t.closest(".you")) typing = t;
      });
      card.querySelectorAll(".caret").forEach((k) => k.remove());
      if (typing) typing.insertAdjacentHTML("afterend", '<span class="caret"></span>');
      const body = card.querySelector(".term-body");
      if (body) body.scrollTop = body.scrollHeight;
    });

    const cap = document.getElementById("caption");
    if (s.caption) {
      cap.textContent = s.caption.text;
      cap.style.opacity = s.caption.opacity;
      cap.style.transform = `translateX(-50%) translateY(${(1 - s.caption.opacity) * 14}px)`;
    } else cap.style.opacity = 0;
    // A decode can hang now and then in headless Chrome; never wait on one for long.
    await Promise.race([Promise.all(loads), new Promise((r) => setTimeout(r, 2000))]);
    return true;
  };
</script>
</body>
</html>

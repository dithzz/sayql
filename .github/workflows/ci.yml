# Runs the type check and all tests on every pull request and push to main.
# It uses no secrets, so it is safe for pull requests from forks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libasound2-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Type check and build the UI
        run: pnpm build

      - name: Frontend tests
        run: pnpm exec vitest run

      - name: Backend tests
        working-directory: src-tauri
        run: cargo test --lib

  # The backend builds C++ (whisper.cpp, for voice input), so check that it still compiles
  # on every platform the release builds for, not only Linux.
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # tauri::generate_context! needs the built UI folder to exist.
      - run: mkdir -p dist
        shell: bash

      - name: Build the backend
        working-directory: src-tauri
        run: cargo build --lib --target ${{ matrix.target }}

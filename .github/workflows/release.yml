# Builds installers for macOS, Windows and Linux and publishes them, plus the
# updater's latest.json, as a draft release in the public dithzz/sayql-releases
# repository when a version tag (v0.1.0, v0.2.0, ...) is pushed.
#
# Early-access builds are not code-signed (macOS uses ad-hoc signing), so people
# confirm the first launch themselves; see docs/RELEASING.md. Updates are signed
# with the updater key either way.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/sayql-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (macOS Keychain: "Sayql updater signing key password")
#   RELEASES_TOKEN                      fine-grained token with Contents: read and write on dithzz/sayql-releases
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Local builds skip updater artifacts because they need the private key.
      # Release builds turn them on here.
      - name: Enable updater artifacts
        shell: bash
        run: |
          jq '.bundle.createUpdaterArtifacts = true' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      # The MCP server (src/bin/sayql-mcp.rs) needs no step here: Tauri bundles every binary
      # in the crate next to the app (Contents/MacOS, /usr/bin, Program Files), where
      # Settings → AI apps finds it. Adding it as an externalBin as well duplicates it.
      - uses: tauri-apps/tauri-action@v1
        env:
          # Creates the release in the separate releases repo, which hosts the downloads and update feed.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: dithzz
          repo: sayql-releases
          # The release's tag points at the releases repo's own branch; this repo's
          # commits don't exist there.
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: "SayQL Community Edition ${{ github.ref_name }}"
          releaseBody: |
            Free forever, for personal and commercial use.

            **Early access:** these builds aren't code-signed yet, so your computer asks you to confirm the first launch.
            - **macOS:** open the app once, then go to System Settings → Privacy & Security and click **Open Anyway**.
            - **Windows:** on "Windows protected your PC", click **More info → Run anyway**.
            - **Linux:** use the `.AppImage` (make it executable), or install the `.deb` or `.rpm`.
          # v1 fails if a release with this tag already exists and isn't a draft,
          # so re-running a published tag stops instead of changing it.
          releaseDraft: true
          prerelease: false
          # latest.json links to each archive by its GitHub API asset URL; the
          # updater-links job below swaps those for public download URLs.
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

  # tauri-action v1 writes API asset URLs (api.github.com/.../releases/assets/<id>) into
  # latest.json. The updater can fetch those (it sends Accept: application/octet-stream), but
  # anonymous GitHub API calls are limited to 60 an hour per IP, so a team behind one office
  # address could see failed updates. Public download URLs have no such limit and also work
  # in a browser. The tag name is used, so the URLs are right once the draft is published.
  updater-links:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Point latest.json at public download URLs
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          REPO: dithzz/sayql-releases
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          id=$(gh api "repos/$REPO/releases?per_page=30" -q ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)
          gh api "repos/$REPO/releases/$id/assets?per_page=100" -q '.[] | "\(.id) \(.name)"' > ids.txt
          gh release download "$TAG" -R "$REPO" -p latest.json -D .
          python3 - <<'EOF'
          import json, os
          tag, repo = os.environ["TAG"], os.environ["REPO"]
          ids = dict(line.split(" ", 1) for line in open("ids.txt").read().splitlines())
          d = json.load(open("latest.json"))
          for key, p in d["platforms"].items():
              if "/releases/assets/" in p["url"]:
                  p["url"] = f"https://github.com/{repo}/releases/download/{tag}/{ids[p['url'].rsplit('/', 1)[-1]]}"
              print(key, p["url"])
          json.dump(d, open("latest.json", "w"), indent=2)
          EOF
          gh release upload "$TAG" latest.json -R "$REPO" --clobber

# Builds installers for macOS, Windows and Linux and publishes them, plus the
# updater's latest.json, as a draft release in the public dithzz/sayql-releases
# repository when a version tag (v0.1.0, v0.2.0, ...) is pushed.
#
# Early-access builds are not code-signed (macOS uses ad-hoc signing), so people
# confirm the first launch themselves; see docs/RELEASING.md. Updates are signed
# with the updater key either way.
#
# Secrets (Settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY           contents of ~/.tauri/sayql-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (macOS Keychain: "Sayql updater signing key password")
#   RELEASES_TOKEN                      fine-grained token with Contents: read and write on dithzz/sayql-releases
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Local builds skip updater artifacts because they need the private key.
      # Release builds turn them on here.
      - name: Enable updater artifacts
        shell: bash
        run: |
          jq '.bundle.createUpdaterArtifacts = true' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      # The MCP server (src/bin/sayql-mcp.rs) ships inside the app, next to its executable,
      # where Settings → AI apps finds it. Tauri bundles it as a sidecar, which it expects as
      # binaries/sayql-mcp-<target triple>. Only release builds bundle it, so `tauri dev` and
      # `cargo test` don't need it built first.
      - name: Build the MCP server and bundle it with the app
        shell: bash
        run: |
          target="${{ matrix.rust_targets }}"
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          if [ -n "$target" ]; then
            cargo build --release --manifest-path src-tauri/Cargo.toml --bin sayql-mcp --target "$target"
            built="src-tauri/target/$target/release/sayql-mcp$ext"
          else
            target=$(rustc -vV | sed -n 's/^host: //p')
            cargo build --release --manifest-path src-tauri/Cargo.toml --bin sayql-mcp
            built="src-tauri/target/release/sayql-mcp$ext"
          fi
          mkdir -p src-tauri/binaries
          cp "$built" "src-tauri/binaries/sayql-mcp-$target$ext"
          jq '.bundle.externalBin = ["binaries/sayql-mcp"]' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      - uses: tauri-apps/tauri-action@v0
        env:
          # Creates the release in the separate releases repo, which hosts the downloads and update feed.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: dithzz
          repo: sayql-releases
          # The release's tag points at the releases repo's own branch; this repo's
          # commits don't exist there.
          releaseCommitish: main
          tagName: ${{ github.ref_name }}
          releaseName: "SayQL Community Edition ${{ github.ref_name }}"
          releaseBody: |
            Free forever, for personal and commercial use.

            **Early access:** these builds aren't code-signed yet, so your computer asks you to confirm the first launch.
            - **macOS:** open the app once, then go to System Settings → Privacy & Security and click **Open Anyway**.
            - **Windows:** on "Windows protected your PC", click **More info → Run anyway**.
            - **Linux:** use the `.AppImage` (make it executable), or install the `.deb` or `.rpm`.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

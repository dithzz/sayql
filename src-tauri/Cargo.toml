[package]
name = "sayql"
version = "0.2.4"
description = "AI-first database client: ask in English, get SQL as you type"
authors = ["Adith"]
edition = "2024"
# `tauri dev` runs the app; the MCP server is the separate `sayql-mcp` binary.
default-run = "sayql"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sayql_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures-util = "0.3"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "mysql",
  # MySQL 8 sends the password RSA-encrypted when the connection has no TLS.
  "mysql-rsa",
  "sqlite",
  "chrono",
  "uuid",
  "json",
  "rust_decimal",
] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rust_decimal = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-updater = "2"
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
rmcp = { version = "3.6.0", features = ["server", "transport-io", "macros"] }
dirs = "7"
schemars = "1"
whisper-rs = "0.16"
cpal = "0.18"
sha2 = "0.10"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

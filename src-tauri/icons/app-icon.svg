<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SayQL brand icon: a Q whose tail is a speech-bubble tail ("say" + "QL").
       To change it, edit this file and run `pnpm tauri icon src-tauri/icons/app-icon.svg`. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Rounded square inside the macOS 824px safe area -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  <!-- The Q's ring -->
  <circle cx="496" cy="478" r="196" fill="none" stroke="#FFFFFF" stroke-width="96"/>
  <!-- Its tail, drawn as a speech-bubble tail -->
  <path d="M676 590 C 700 670 742 728 800 772 C 716 770 646 740 594 690 Z" fill="#FFFFFF"/>
</svg>
